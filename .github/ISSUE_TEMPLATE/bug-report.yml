name: Bug report
description: Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the game
        2. Click Create room
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Local play vs bots
        - Host
        - Guest
        - Not in a match
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 140, Chrome 140, Safari 18
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Paste any errors from the browser console.
      render: shell
    validations:
      required: false
